name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python scripts/build-downloads.py --check
      - run: python scripts/test-downloads.py
      - run: python -B -m unittest discover -s test -p "test_*.py" -v
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -I -B -c "import runpy; runpy.run_path('scripts/iphone-usb-ui.py')"
